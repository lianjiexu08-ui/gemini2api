<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; font-size: 13px; }
  h3 { margin: 0 0 10px; font-size: 14px; }
  label { display: block; margin: 8px 0 2px; color: #666; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 10px; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; }
  .primary { background: #1a73e8; color: #fff; }
  .primary:disabled { background: #9fc1f0; cursor: not-allowed; }
  .success { background: #188038; color: #fff; }
  .hidden { display: none; }
  #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f1f3f4; white-space: pre-wrap; word-break: break-all; }
  #status.err { background: #fce8e6; color: #c5221f; }
  #status.warn { background: #feefc3; color: #b06000; }
  .tip { color: #888; font-size: 12px; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
  <h3>gemini2api 上号助手</h3>

  <div id="config">
    <label>gemini2api 地址</label>
    <input id="server" placeholder="http://154.21.193.37:5918">
    <label>Admin Key</label>
    <input id="adminKey" type="password" placeholder="ad2b7e1e1f75...">
    <button id="save" class="primary">保存配置</button>
  </div>

  <button id="capture" class="primary hidden">捕获当前 Gemini 会话</button>
  <div id="storeRow" class="hidden" style="margin-top:8px">
    <label>Cookie 来源窗口</label>
    <select id="store" class="form-control"></select>
  </div>
  <button id="confirm" class="success hidden">确认上号</button>
  <div id="status" class="hidden"></div>

  <div class="tip"><b>多账号必读</b>：<code>__Secure-1PSID</code> 永远属于该浏览器 Profile 的<b>默认账号</b>
  （第一个登录的号），网页右上角切头像不会改变它！<br>
  推荐：每个车位用独立无痕窗口登录 → 保持窗口不关 → 插件里选「无痕窗口」捕获。<br>
  长期方案：给每个车位建独立 Chrome Profile（独立 Cookie 罐，天然无串号）。</div>

  <script src="popup.js"></script>
</body>
</html>
